<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<header class="spine">
  <div class="spine-title"><span class="block-icon"></span><span class="title-text">LEDGER<span>Personal expense book</span></span></div>
  <a class="tab active" href="index.html">Dashboard</a>
  <a class="tab" href="expenses.html">Expenses</a>
  <a class="tab" href="expense-form.html">Add Expense</a>
</header>
 
<main>
  <div class="page-head">
    <h1>Dashboard</h1>
    <div class="date" id="today-date"></div>
  </div>
 
  <div class="stat-row">
    <div class="stat balance">
      <div class="label">Total spent, this book</div>
      <div class="value mono" id="stat-total">₱0.00</div>
    </div>
    <div class="stat spend">
      <div class="label">Largest single entry</div>
      <div class="value mono" id="stat-largest">₱0.00</div>
    </div>
    <div class="stat count">
      <div class="label">Entries recorded</div>
      <div class="value mono" id="stat-count">0</div>
    </div>
  </div>
 
  <div class="section-label">
    <span>By category</span>
  </div>
  <div class="cat-list" id="category-rows"></div>
 
  <div class="section-label">
    <span>Most recent entries</span>
    <a href="expenses.html">View all</a>
  </div>
  <table class="ledger">
    <thead>
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Category</th>
        <th class="num">Amount</th>
      </tr>
    </thead>
    <tbody id="recent-rows"></tbody>
  </table>
</main>
 
<script src="app.js"></script>
<script>
